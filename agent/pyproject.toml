[project]
name = "sagemaker-mtrl-support-agent"
version = "0.1.0"
description = "Customer-support rollout agent for SageMaker multi-turn RL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bedrock-agentcore==1.24.0",
    "pydantic==2.13.5",
    "sagemaker-core==2.23.0",
    "sagemaker-train==1.23.0",
    "strands-agents[openai]==1.57.2",
]

[tool.setuptools]
py-modules = ["app", "environment", "rollout_driver"]
