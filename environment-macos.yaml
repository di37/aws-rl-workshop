# SageMaker Multi-Turn RL workshop -- macOS run-of-record environment.
# Python 3.12 plus the exact pip pins of the run of record; create with:
#   conda env create -f environment-macos.yaml && conda activate aws-mtrl
name: aws-mtrl
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements-macos.txt
